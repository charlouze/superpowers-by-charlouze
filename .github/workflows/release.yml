name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # The release pull request is opened by the agent's GitHub App, not by
      # GITHUB_TOKEN: a pull request opened with GITHUB_TOKEN triggers no
      # workflow, so its required checks would never run and it could never merge.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app.outputs.token }}
